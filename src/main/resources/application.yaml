server:
  port: ${PORT:8081}
spring:
  application:
    name: oficina360

  datasource:
    url: jdbc:h2:mem:oficina360;MODE=PostgreSQL;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_URL:}
    port: ${MAIL_PORT:}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    doc-expansion: none
  api-docs:
    path: /v3/api-docs

api:
  security:
    jwt:
      secret: ${JWT_SECRET:oficina360-secret-key-dev}
      issuer: oficina360-api
      expiration-hours: 2

app:
  timezone: ${TIME_ZONE:America/Sao_Paulo}

management:
  endpoints:
    web:
      exposure:
        include: health,info

  health:
    mail:
      enabled: false

    readinessstate:
      enabled: true

    livenessstate:
      enabled: true

  endpoint:
    health:
      probes:
        enabled: true

      group:
        readiness:
          include:
            - readinessState
            - db

        liveness:
          include:
            - livenessState