services:
  oficina360:
    restart: unless-stopped

    build:
      context: .
      dockerfile: Dockerfile

    container_name: oficina360-api

    ports:
      - "18080:8081"

    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: oficina360
      DB_USERNAME: oficina360
      DB_PASSWORD: oficina360

    networks:
      - oficina360-network

networks:
  oficina360-network:
    external: true